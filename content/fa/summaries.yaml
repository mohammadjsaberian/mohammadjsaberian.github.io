shared:
  segments:
    - text: "مهندس نرم‌افزار"
      bold: true
    - text: " با بیش از "
    - text: "۴ سال سابقه"
      bold: true
    - text: " و تمرکز بر توسعه "
    - text: "سرویس‌های پیچیده بک‌اند"
      bold: true
    - text: " و "
    - text: "نرم‌افزارهای آماده بهره‌برداری در محیط واقعی"
    - text: ". دارای تجربه در "
    - text: "طراحی سیستم"
      bold: true
    - text: "، معماری اصولی و راهکارهای مقیاس‌پذیر"
    - text: "، با "
    - text: "ذهنیت یادگیری مستمر و حل مسئله"
    - text: "؛ متمرکز بر ساخت نرم‌افزارهایی که "
    - text: "بهره‌وری را افزایش می‌دهند، هزینه توسعه را کاهش می‌دهند و به "
    - text: "رشد قابل‌اندازه‌گیری کسب‌وکار"
      bold: true
    - text: " کمک می‌کنند"
    - text: "."
